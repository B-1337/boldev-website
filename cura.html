  renderVals() {
    var self = this, s = this.state;

      next: function () { self.setState({ hs: ((self.state.hs || 0) + 1) % hN }); }
    };
    var lb = {
      count: n, isOpen: i >= 0, num: i + 1,
      isClosed: i < 0,
      strip: PH.map(function (p, k) {
        var cur = k === i;
        return { src: p[0], label: 'Toon foto: ' + p[1], current: cur ? 'true' : 'false', open: function () { self.setState({ lb: k }); },
          style: 'flex: none; width: 96px; height: 96px; padding: 0; border-radius: 8px; overflow: hidden; cursor: pointer; background: #f7f5f1; ' + (cur ? 'border: 3px solid #003070' : 'border: 2px solid #e3e7ee') };
      }),
      src: i >= 0 ? PH[i][0] : '', alt: i >= 0 ? PH[i][1] : '',

      close: function () { self.setState({ lb: -1 }); },

      next: function () { self.setState({ lb: (self.state.lb + 1) % n }); },
      thumbs: PH.slice(0, 8).map(function (p, k) {
        var big = k === 0;
        return {

          style: 'padding: 0; border: none; border-radius: 4px; overflow: hidden; cursor: pointer; background: #f7f5f1; ' + (big ? 'grid-column: span 2; grid-row: span 2' : '')

    var FAQ = [

      ['Kan ik iemand meenemen?', 'Ja. Achterin is een passagiersplaats, achter de bestuurder. Daar kun je ook je boodschappen kwijt.'],
      ['Hoe vaak moet de Cura in onderhoud?', 'Elke 2.000 km, volgens het onderhoudsboekje. Dat doet je dealer. Het onderhoud is nodig voor de garantie.']
    ];
    var faq = FAQ.map(function (f, k) {
      var open = s.faq === k;
      return {
        q: f[0], a: f[1], open: open,
        toggle: function () { self.setState({ faq: self.state.faq === k ? -1 : k }); },
        iconStyle: 'flex: none; display: inline-flex; width: 40px; height: 40px; border-radius: 50%; align-items: center; justify-content: center; background: #e8eef7; color: #003070; transition: transform 200ms ease; transform: rotate(' + (open ? '180deg' : '0deg') + ')'
      };
    });

    // Formulier
    var F = s.f;
    var DEF = [
      ['naam', 'Naam', 'text', 'name', function (v) { return v.trim().length > 1 ? '' : 'Vul je naam in.'; }, true],
      ['tel', 'Telefoonnummer', 'tel', 'tel', function (v) { return v.replace(/\D/g, '').length >= 10 ? '' : 'Vul een telefoonnummer van 10 cijfers in.'; }, false],
      ['mail', 'E-mailadres', 'email', 'email', function (v) { return /^\S+@\S+\.\S+$/.test(v.trim()) ? '' : 'Vul een geldig e-mailadres in.'; }, false],
      ['pc', 'Postcode', 'text', 'postal-code', function (v) { return /^\d{4}\s?[a-zA-Z]{2}$/.test(v.trim()) ? '' : 'Vul je postcode in, bijvoorbeeld 8239 DE.'; }, false],
      ['plaats', 'Woonplaats', 'text', 'address-level2', function (v) { return v.trim().length > 1 ? '' : 'Vul je woonplaats in.'; }, false]
    ];
    var errs = {}, nErr = 0;
    DEF.forEach(function (d) { var e = d[4](F[d[0]] || ''); errs[d[0]] = e; if (e) nErr++; });
    var config = 'Bold Cura · ' + cur.name + ' · ' + ACCU[s.accu].short + ' · ' + SPEED[s.speed].title + (s.rol ? ' · met rolstoelhouder' : '');
    function tab(on) { return 'min-height: 52px; border-radius: 8px; border: none; cursor: pointer; font: 600 18px Poppins, sans-serif; ' + (on ? 'background: #003070; color: #ffffff' : 'background: transparent; color: #003070'); }
    var Q = s.q || { naam: '', tel: '', mail: '' };
    var QDEF = [
      ['naam', 'Naam', 'text', 'name', function (v) { return v.trim().length > 1 ? '' : 'Vul je naam in.'; }],
      ['tel', 'Telefoonnummer', 'tel', 'tel', function (v) { return v.replace(/\D/g, '').length >= 10 ? '' : 'Vul een telefoonnummer van 10 cijfers in.'; }],
      ['mail', 'E-mailadres', 'email', 'email', function (v) { return /^\S+@\S+\.\S+$/.test(v.trim()) ? '' : 'Vul een geldig e-mailadres in.'; }]
    ];
    var qErr = 0, qErrs = {};
    QDEF.forEach(function (d) { var e = d[4](Q[d[0]] || ''); qErrs[d[0]] = e; if (e) qErr++; });
    var q = {
      notSent: !s.qsent, sent: !!s.qsent, summary: config, firstName: (Q.naam || '').trim().split(' ')[0] || '',
      label: s.qsending ? 'Bezig met versturen…' : 'Verstuur offerteaanvraag',
      fields: QDEF.map(function (d) {
        var showErr = !!s.qtried && !!qErrs[d[0]];

          onChange: function (e) { var nq = Object.assign({ naam: '', tel: '', mail: '' }, self.state.q); nq[d[0]] = e.target.value; self.setState({ q: nq }); },

      }),
      submit: function () {
        if (self.state.qsending) return;
        if (qErr > 0) { self.setState({ qtried: true }); return; }

        self.later(1100, function () { self.setState({ qsending: false, qsent: true }); });
      },
      reset: function () { self.setState({ qsent: false, q: { naam: '', tel: '', mail: '' } }); }
    };
    var form = {
      notSent: !s.sent, sent: s.sent, hasErrors: s.tried && nErr > 0,
      isOfferte: s.mode === 'offerte', isProefrit: s.mode === 'proefrit',
      tabOfferte: tab(s.mode === 'offerte'), tabProefrit: tab(s.mode === 'proefrit'),
      setOfferte: function () { self.setState({ mode: 'offerte' }); },
      setProefrit: function () { self.setState({ mode: 'proefrit' }); },
      toOfferte: function () { self.setState({ mode: 'offerte', sent: false }); },
      toProefrit: function () { self.setState({ mode: 'proefrit', sent: false }); },
      isThuis: s.where === 'thuis', isDealer: s.where === 'dealer',
      thuisStyle: opt(s.where === 'thuis'), dealerStyle: opt(s.where === 'dealer'),
      setThuis: function () { self.setState({ where: 'thuis' }); },
      setDealer: function () { self.setState({ where: 'dealer' }); },
      advies: s.advies, toggleAdvies: function () { self.setState({ advies: !self.state.advies }); },
      wmo: s.wmo, toggleWmo: function () { self.setState({ wmo: !self.state.wmo }); },
      gespreid: s.gespreid, toggleGespreid: function () { self.setState({ gespreid: !self.state.gespreid }); },
      opm: s.opm, onOpm: function (e) { self.setState({ opm: e.target.value }); },
      summary: s.advies ? 'Bold Cura · advies gewenst over de uitvoering' : config,
      submitLabel: s.sending ? 'Bezig met versturen…' : s.mode === 'proefrit' ? 'Vraag gratis proefrit aan' : 'Vraag vrijblijvend offerte aan',
      kind: s.mode === 'proefrit' ? 'gratis proefrit' : 'offerte',
      step3: s.mode === 'proefrit' ? (s.where === 'thuis' ? 'Je plant samen een moment waarop de dealer bij je thuis langskomt.' : 'Je plant samen een moment voor je proefrit bij de dealer.') : 'Je krijgt een offerte op maat, met de exacte mogelijkheden voor gespreid betalen.',
      firstName: (F.naam || '').trim().split(' ')[0] || '',

        var showErr = s.tried && !!errs[d[0]];
        return {
          id: 'f-' + d[0], label: d[1], type: d[2], ac: d[3], value: F[d[0]],
          wrap: 'display: flex; flex-direction: column; gap: 8px; ' + (d[5] ? 'grid-column: 1 / -1' : ''),
          hasErr: showErr, err: errs[d[0]],
          onChange: function (e) { var nf = Object.assign({}, self.state.f); nf[d[0]] = e.target.value; self.setState({ f: nf }); },
          style: 'min-height: 58px; padding: 0 18px; border-radius: 8px; font: 400 18px Poppins, sans-serif; color: #1a2433; background: #ffffff; width: 100%; border: ' + (showErr ? '2px solid #b42318' : '2px solid #8a96a8')

      }),
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (self.state.sending) return;
        if (nErr > 0) { self.setState({ tried: true }); return; }
        self.setState({ sending: true, tried: false });
        self.later(1100, function () { self.setState({ sending: false, sent: true }); });
      },
      reset: function () { self.setState({ sent: false, f: { naam: '', tel: '', mail: '', pc: '', plaats: '' }, opm: '' }); }
    };

    var ui = {
      leaving: !!s.leaving, toastOn: !!s.toast, toastText: s.toast,
      // Klikken op links: lege links tonen een melding.
      rootClick: function (e) {
        var t = e.target, a = t && t.closest ? t.closest('a') : null;
        if (!a) { if (s.dd && !(t.closest && t.closest('[aria-controls="dd-modellen"], #dd-modellen'))) self.setState({ dd: false }); return; }
        var h = a.getAttribute('href') || '';
        if (h === '#') {
          e.preventDefault();
          clearTimeout(self.tt); self.setState({ toast: 'Deze pagina ontwerpen we in een volgende ronde.', dd: false });

        if (h.charAt(0) === '#') { self.setState({ dd: false, menu: false }); return; }
