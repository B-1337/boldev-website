<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dd: false, sub: false, toast: '', leaving: false, searching: false, sending: false, menu: false, vis: 'shown', b: { bedrijf: '', contact: '', plaats: '', tel: '', mail: '' }, btype: '', btried: false, bsending: false, bsent: false };
  }
  componentDidMount() {
    try { this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { this.reduce = false; }
  }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  later(ms, fn) { this.timers = this.timers || []; this.timers.push(setTimeout(fn, ms)); }
  // Laat de huidige inhoud wegfaden, past de state aan en fade de nieuwe inhoud in.
  swap(changes, done) {
    var self = this;
    if (this.reduce) { this.setState(changes()); if (done) done(); return; }
    this.setState({ vis: 'leaving' });
    this.later(240, function () {
      var ch = changes(); ch.vis = 'entering'; self.setState(ch);
      self.later(30, function () { self.setState({ vis: 'shown' }); self.later(260, function () { if (done) done(); }); });
    });
  }
  renderVals() {
    var self = this, s = this.state;
    function opt(sel, center) {
      return 'display: block; width: 100%; text-align: ' + (center ? 'center' : 'left') + '; padding: 16px 18px; border-radius: 8px; cursor: pointer; font: 500 17px/1.35 Poppins, sans-serif; color: #1a2433; ' + (sel ? 'border: 3px solid #003070; background: #e8eef7' : 'border: 2px solid #c9d3e2; background: #ffffff');
    }
    function inputStyle(err) { return 'min-height: 56px; padding: 0 18px; border-radius: 8px; font: 400 18px Poppins, sans-serif; color: #1a2433; background: #ffffff; width: 100%; border: ' + (err ? '2px solid #b42318' : '2px solid #8a96a8'); }
    // Dealer worden
    var B = s.b;
    var BDEF = [
      ['bedrijf', 'Bedrijfsnaam', 'text', 'organization', function (v) { return v.trim().length > 1 ? '' : 'Vul de bedrijfsnaam in.'; }],
      ['contact', 'Contactpersoon', 'text', 'name', function (v) { return v.trim().length > 1 ? '' : 'Vul een naam in.'; }],
      ['plaats', 'Plaats', 'text', 'address-level2', function (v) { return v.trim().length > 1 ? '' : 'Vul de plaats in.'; }],
      ['tel', 'Telefoonnummer', 'tel', 'tel', function (v) { return v.replace(/\D/g, '').length >= 10 ? '' : 'Vul een telefoonnummer van 10 cijfers in.'; }],
      ['mail', 'E-mailadres', 'email', 'email', function (v) { return /^\S+@\S+\.\S+$/.test(v.trim()) ? '' : 'Vul een geldig e-mailadres in.'; }]
    ];
    var berrs = {}, bErr = 0;
    BDEF.forEach(function (d) { var e = d[4](B[d[0]] || ''); berrs[d[0]] = e; if (e) bErr++; });
    if (!s.btype) bErr++;
    var bz = {
      notSent: !s.bsent, sent: s.bsent, company: (B.bedrijf || '').trim() || 'je bedrijf',
      types: ['Mobiliteitszaak', 'Scooterdealer', 'Garage', 'Anders'].map(function (t) {
        return { title: t, selected: s.btype === t, style: opt(s.btype === t, true) + '; padding: 14px 8px; font-size: 16px', pick: function () { self.setState({ btype: t }); } };
      }),
      errType: s.btried && !s.btype,
      fields: BDEF.map(function (d) {
        var showErr = s.btried && !!berrs[d[0]];
        return {
          id: 'bz-' + d[0], label: d[1], type: d[2], ac: d[3], value: B[d[0]], hasErr: showErr, err: berrs[d[0]],
          wrap: 'display: flex; flex-direction: column; gap: 6px; min-width: 0; ' + (['bedrijf','contact','mail'].indexOf(d[0]) > -1 ? 'grid-column: 1 / -1' : ''),
          onChange: function (e) { var nb = Object.assign({}, self.state.b); nb[d[0]] = e.target.value; self.setState({ b: nb }); },
          style: inputStyle(showErr)
        };
      }),
      submitLabel: s.bsending ? 'Bezig met versturen…' : 'Aanmelden als dealer',
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (self.state.bsending) return;
        if (bErr > 0) { self.setState({ btried: true }); return; }
        self.setState({ bsending: true, btried: false });
        self.later(1100, function () { self.setState({ bsending: false, bsent: true }); });
      }
    };
    var ui = {
      leaving: !!s.leaving, toastOn: !!s.toast, toastText: s.toast,
      // Klikken op links: lege links tonen een melding.
      rootClick: function (e) {
        var t = e.target, a = t && t.closest ? t.closest('a') : null;
        if (!a) { if (s.dd && !(t.closest && t.closest('[aria-controls="dd-modellen"], #dd-modellen'))) self.setState({ dd: false }); return; }
        var h = a.getAttribute('href') || '';
        if (h === '#') {
          e.preventDefault();
          clearTimeout(self.tt); self.setState({ toast: 'Deze pagina ontwerpen we in een volgende ronde.', dd: false });
          self.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2800);
          return;
        }
        if (h.charAt(0) === '#') { self.setState({ dd: false, menu: false }); return; }
      }
    };
    var nav = {
      ddOpen: !!s.dd, toggleDd: function () { self.setState({ dd: !self.state.dd }); },
      subOpen: !!s.sub, toggleSub: function () { self.setState({ sub: !self.state.sub }); },
      chev: 'transition: transform 200ms ease; transform: rotate(' + ((s.dd || s.sub) ? '180deg' : '0deg') + ')',
      ddBtn: 'display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 10px; border: none; cursor: pointer; font: 500 18px Poppins, sans-serif; color: #1a2433; background: ' + (s.dd ? '#e8eef7' : 'transparent')
    };
    return { ui: ui, nav: nav, bz: bz, menuOpen: s.menu, menuClosed: !s.menu, menuLabel: s.menu ? 'Sluit' : 'Menu', toggleMenu: function () { self.setState({ menu: !self.state.menu }); } };
  }
}
