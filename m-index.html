<p style="margin: 0 0 24px; color: #3b4656">17 locaties in Nederland. Advies en service dichtbij.</p>
<div role="form" style="display: flex; flex-direction: column; gap: 10px">
<label for="pc-m" style="font-weight: 600">Je postcode</label>

<button type="button" onClick="{{ dz.search }}" style="min-height: 60px; border-radius: 12px; border: none; background: #003070; color: #ffffff; font: 600 19px 'Poppins', sans-serif; cursor: pointer">{{ dz.btnLabel }}</button>
</div>
<sc-if value="{{ dz.hasMsg }}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 12px 0 0; padding: 12px 16px; border-radius: 12px; background: #fff0e6; color: #6e2e06; font-size: 17px">{{ dz.msg }}</p>
</sc-if>
<sc-if value="{{ dz.hasResults }}" hint-placeholder-val="{{ false }}">
<p style="margin: 24px 0 12px; font-weight: 600">Dichtstbij {{ dz.where }}</p>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; animation: boldfade 350ms ease both">
<sc-for list="{{ dz.results }}" as="d" hint-placeholder-count="3">
<li style="padding: 20px; border-radius: 16px; border: 1px solid #e3e7ee">
<div style="display: flex; justify-content: space-between; gap: 12px">

<p style="margin: 0; font-weight: 600; white-space: nowrap">± {{ d.km }} km</p>
</div>
<p style="margin: 4px 0 14px; color: #3b4656; font-size: 16px">{{ d.address }}</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="{{ d.tel }}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 8px; border: 2px solid #c9d3e2; color: #003070; font-weight: 600; text-decoration: none; font-size: 16px">Bellen</a>

</div>
</li>
</sc-for>

        var sel = i === (s.tcolor || 0);
        return {
          name: c.name, selected: sel, pick: function () { self.setState({ tcolor: i }); },
          style: 'width: 48px; height: 48px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: #ffffff; border: ' + (sel ? '3px solid #003070' : '2px solid #c9d3e2'),
          dot: 'width: 32px; height: 32px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); background: ' + c.hex
        };
      })
    };
    var ui = {
      leaving: !!s.leaving, toastOn: !!s.toast, toastText: s.toast,
      // Klikken op links: lege links tonen een melding.
      rootClick: function (e) {
        var t = e.target, a = t && t.closest ? t.closest('a') : null;
        if (!a) { if (s.dd && !(t.closest && t.closest('[aria-controls="dd-modellen"], #dd-modellen'))) self.setState({ dd: false }); return; }
        var h = a.getAttribute('href') || '';
        if (h === '#') {
          e.preventDefault();
          clearTimeout(self.tt); self.setState({ toast: 'Deze pagina ontwerpen we in een volgende ronde.', dd: false });
          self.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2800);
          return;
        }
        if (h.charAt(0) === '#') { self.setState({ dd: false, menu: false }); return; }
      }
    };
    var nav = {
      ddOpen: !!s.dd, toggleDd: function () { self.setState({ dd: !self.state.dd }); },
      subOpen: !!s.sub, toggleSub: function () { self.setState({ sub: !self.state.sub }); },
      chev: 'transition: transform 200ms ease; transform: rotate(' + ((s.dd || s.sub) ? '180deg' : '0deg') + ')',
      ddBtn: 'display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 10px; border: none; cursor: pointer; font: 500 18px Poppins, sans-serif; color: #1a2433; background: ' + (s.dd ? '#e8eef7' : 'transparent')
    };
    var VIDS = [
      ['ZyeCUeqQFLA', 'Boodschappen doen met de Cura', 'Een rondje rijden en de boodschappen achterin.', 'img/e933d49650d714017f58c153222fdf6b.jpg', '50% 50%', 'none'],
      ['Oc2TMmz6itQ', 'Door de stad en het park', 'Rustig en zelfstandig op pad.', 'img/057c7afa4986f3cf56d0aa9dc814e8e7.jpg', '50% 65%', 'brightness(1.18) saturate(1.05)']
    ];
    var vids = VIDS.map(function (v) {
      var on = s.vid === v[0];
      return { title: v[1], desc: v[2], poster: v[3], pos: v[4], filter: v[5], playing: on, notPlaying: !on, label: 'Bekijk de video op YouTube: ' + v[1], url: 'https://www.youtube.com/watch?v=' + v[0],
        embed: 'https://www.youtube-nocookie.com/embed/' + v[0] + '?autoplay=1&rel=0', play: function () { self.setState({ vid: v[0] }); } };
    });
    return { vids: vids, ui: ui, nav: nav, titan: titan,
      cura: cura, kh: kh, dz: dz,
      menuOpen: s.menu, menuClosed: !s.menu, menuLabel: s.menu ? 'Sluit' : 'Menu',
      toggleMenu: function () { self.setState({ menu: !self.state.menu }); }
    };
  }
}

DCMount(Component);
</script>
