<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dd: false, sub: false, toast: '', leaving: false, searching: false, sending: false, menu: false, vis: 'shown', color: 0, accu: '24', speed: '32', scherm: 'geen', bed: 'std', side: 'rechts', ex: {}, lb: -1, faq: 0, advies: false, wmo: false, gespreid: false, opm: '', f: { naam: '', tel: '', mail: '', pc: '', plaats: '' }, tried: false, sent: false };

  componentDidMount() {

  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }

      var ch = changes(); ch.vis = 'entering'; self.setState(ch);

  renderVals() {
    var self = this, s = this.state;

      { name: 'Glans zwart', hex: '#111316', img: 'img/6be7deade845577207168894d7dc1553.jpg' }

    function val(k) { return s[k] || DEF[k]; }

      }),
      src: li >= 0 ? PH[li][0] : '', alt: li >= 0 ? PH[li][1] : '',

      close: function () { self.setState({ lb: -1 }); },
      prev: function () { self.setState({ lb: (self.state.lb - 1 + n) % n }); },
      next: function () { self.setState({ lb: (self.state.lb + 1) % n }); },
      thumbs: PH.slice(0, 8).map(function (p, k) {
        var big = k === 0;
        return {

        };
      })
    };

    // FAQ
    var FAQ = [
      ['Heb ik een rijbewijs nodig voor de Titan?', 'Nee. Je hebt geen rijbewijs en geen kenteken nodig, en je betaalt geen wegenbelasting. Een WA-verzekering is wel verplicht.'],

    var faq = FAQ.map(function (f, k) {
      var open = s.faq === k;

        toggle: function () { self.setState({ faq: self.state.faq === k ? -1 : k }); },

    // Offerteformulier
    var F = s.f;

    ];
    var errs = {}, nErr = 0;
    DEF.forEach(function (d) { var e = d[4](F[d[0]] || ''); errs[d[0]] = e; if (e) nErr++; });

      }),

      ddOpen: !!s.dd, toggleDd: function () { self.setState({ dd: !self.state.dd }); },

      chev: 'transition: transform 200ms ease; transform: rotate(' + ((s.dd || s.sub) ? '180deg' : '0deg') + ')',
      ddBtn: 'display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 8px; border: none; cursor: pointer; font: 500 18px Poppins, sans-serif; color: #1a2433; background: ' + (s.dd ? '#e8eef7' : 'transparent')
    };
    return { hero: hero, q: q, ui: ui, nav: nav, cfg: cfg, lb: lb, faq: faq, form: form, menuOpen: s.menu, menuClosed: !s.menu, menuLabel: s.menu ? 'Sluit' : 'Menu', toggleMenu: function () { self.setState({ menu: !self.state.menu }); } };
  }
}

DCMount(Component);
</script>
