html{scroll-behavior:smooth}
a,button{transition:background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .15s ease,filter .2s ease}

a[style*="border-radius"]:active,button[style*="border-radius"]:active{transform:translateY(0) scale(0.98);box-shadow:none}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition-duration:1ms !important}[data-fade],[data-fade] *{animation-name:none !important}}
</style>

<p style="margin: 0; color: #d6e0ef">Liever meteen bellen? <a href="tel:+31850805282" style="color: #ffffff; font-weight: 600">085 080 52 82</a></p>
</div>

<div style="flex: 1.4 1 560px; min-width: 0; background: #ffffff; border-radius: 12px; padding: 48px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25)">
<div style="{{ pr.wrapStyle }}">
<sc-if value="{{ pr.notSent }}" hint-placeholder-val="{{ true }}">
<div style="margin-bottom: 32px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px">
<p style="margin: 0; font-weight: 600; color: #003070">Stap {{ pr.stepNum }} van 2</p>
<sc-if value="{{ pr.isStep2 }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ pr.back }}" style="min-height: 40px; padding: 0; border: none; background: none; color: #003070; font: 600 16px 'Poppins', sans-serif; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">Vorige stap</button></sc-if>
</div>
<div style="height: 8px; border-radius: 4px; background: #e8eef7; overflow: hidden"><div style="{{ pr.barStyle }}"></div></div>
</div>

<sc-if value="{{ pr.isStep1 }}" hint-placeholder-val="{{ true }}">
<div role="form" style="display: flex; flex-direction: column; gap: 36px">
<fieldset style="margin: 0; padding: 0; border: none">
<legend style="padding: 0; margin-bottom: 14px; font-size: 22px; font-weight: 600">In welk model wil je rijden?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{ pr.models }}" as="o" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ o.selected }}" onClick="{{ o.pick }}" style="{{ o.style }}">
<img src="{{ o.img }}" alt="" style="width: 100%; height: 130px; object-fit: contain; display: block; margin-bottom: 10px">
<strong style="display: block; font-size: 20px">{{ o.title }}</strong><span style="display: block; color: #3b4656; font-size: 16px">{{ o.desc }}</span></button>
</sc-for>
</div>
<sc-if value="{{ pr.errModel }}" hint-placeholder-val="{{ false }}"><p style="margin: 10px 0 0; color: #b42318; font-weight: 500">Kies een model.</p></sc-if>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: none">
<legend style="padding: 0; margin-bottom: 14px; font-size: 22px; font-weight: 600">Waar wil je proefrijden?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{ pr.places }}" as="o" hint-placeholder-count="2">
<button type="button" aria-pressed="{{ o.selected }}" onClick="{{ o.pick }}" style="{{ o.style }}"><span style="{{ o.iconStyle }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ o.icon }}"></path></svg></span><strong style="display: block; font-size: 19px">{{ o.title }}</strong><span style="display: block; color: #3b4656; font-size: 16px; margin-top: 2px">{{ o.desc }}</span></button>
</sc-for>
</div>
<sc-if value="{{ pr.needPc }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 16px; padding: 20px 22px; border-radius: 8px; background: #f3f6fa; animation: boldfade 250ms ease both">
<label for="pr-pc" style="display: block; font-weight: 600; margin-bottom: 8px">Je postcode</label>
<input id="pr-pc" type="text" autocomplete="postal-code" placeholder="Bijv. 8239 DE" value="{{ pr.pc }}" onChange="{{ pr.onPc }}" onKeyDown="{{ pr.onKey }}" aria-invalid="{{ pr.errPc }}" style="{{ pr.pcStyle }}">
<sc-if value="{{ pr.errPc }}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 0 0; color: #b42318; font-weight: 500">{{ pr.pcMsg }}</p></sc-if>
<sc-if value="{{ pr.hasDealer }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 14px; animation: boldfade 300ms ease both">
<p style="margin: 0 0 2px; color: #4a5566; font-size: 16px">{{ pr.dealerLead }}</p>
<p style="margin: 0; font-size: 19px; font-weight: 600; color: #003070">{{ pr.dealer.name }} <span style="font-weight: 500; color: #1a2433">· ± {{ pr.dealer.km }} km</span></p>
<p style="margin: 2px 0 0; color: #3b4656; font-size: 16px">{{ pr.dealer.address }} · {{ pr.dealer.hours }}</p>

</sc-if>
</div>

<sc-if value="{{ pr.showThuisLink }}" hint-placeholder-val="{{ true }}">

</sc-if>
<sc-if value="{{ pr.errWhere }}" hint-placeholder-val="{{ false }}"><p style="margin: 10px 0 0; color: #b42318; font-weight: 500">Kies waar je wilt proefrijden.</p></sc-if>
</fieldset>

<button type="button" onClick="{{ pr.next }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 64px; border-radius: 8px; border: none; background: #ff8036; color: #00214f; font: 600 20px 'Poppins', sans-serif; cursor: pointer">Volgende stap
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{ pr.isStep2 }}" hint-placeholder-val="{{ false }}">
<div role="form" style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 18px; align-items: center; padding: 16px 20px; border-radius: 8px; background: #f3f6fa">

<div style="flex: 1; min-width: 0"><p style="margin: 0; font-weight: 600; color: #003070">{{ pr.modelName }}</p><p style="margin: 0; color: #3b4656; font-size: 16px">{{ pr.placeTxt }}</p></div>
<button type="button" onClick="{{ pr.back }}" style="min-height: 44px; padding: 0; border: none; background: none; color: #003070; font: 600 16px 'Poppins', sans-serif; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">Wijzig</button>
</div>
<fieldset style="margin: 0; padding: 0; border: none">
<legend style="padding: 0; margin-bottom: 14px; font-size: 22px; font-weight: 600">Hoe bereiken we je?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<sc-for list="{{ pr.fields }}" as="f" hint-placeholder-count="3">
<div style="{{ f.wrap }}">
<label for="{{ f.id }}" style="font-weight: 600">{{ f.label }}</label>
<input id="{{ f.id }}" type="{{ f.type }}" autocomplete="{{ f.ac }}" value="{{ f.value }}" onChange="{{ f.onChange }}" aria-invalid="{{ f.hasErr }}" style="{{ f.style }}">
<sc-if value="{{ f.hasErr }}" hint-placeholder-val="{{ false }}"><span style="color: #b42318; font-size: 16px; font-weight: 500">{{ f.err }}</span></sc-if>
</div>
</sc-for>
</div>
</fieldset>
<button type="button" onClick="{{ pr.submit }}" style="width: 100%; min-height: 64px; border-radius: 8px; border: none; background: #ff8036; color: #00214f; font: 600 20px 'Poppins', sans-serif; cursor: pointer">{{ pr.submitLabel }}</button>
</div>
</sc-if>
</sc-if>

<sc-if value="{{ pr.sent }}" hint-placeholder-val="{{ false }}">

<span style="display: inline-flex; width: 64px; height: 64px; border-radius: 50%; background: #e6f4ec; color: #1d7a46; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
<h2 style="margin: 0; font-size: 34px; line-height: 1.2; color: #003070; font-weight: 700">Bedankt, {{ pr.firstName }}! We bellen je binnen 24 uur.</h2>
<p style="margin: 0; color: #3b4656">{{ pr.thanks }}</p>
<div style="padding: 18px 22px; border-radius: 8px; background: #f3f6fa"><p style="margin: 0 0 2px; font-weight: 600">Je proefrit</p><p style="margin: 0; color: #3b4656">{{ pr.summary }}</p></div>
<button type="button" onClick="{{ pr.reset }}" style="align-self: flex-start; min-height: 44px; padding: 0; border: none; background: none; color: #003070; font: 600 17px 'Poppins', sans-serif; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">Terug naar het formulier</button>
</div>
</sc-if>
</div>
</div>
